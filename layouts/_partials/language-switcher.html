{{ if .IsTranslated }}
  {{ $translations := .AllTranslations }}
  <nav class="language-switcher" aria-label="{{ T "language.switcher" }}">
    {{ range $translations }}
      <a
        class="language-switcher__link{{ if eq .Language.Lang $.Language.Lang }} is-active{{ end }}"
        href="{{ .RelPermalink }}"
        lang="{{ .Language.Lang }}"
      >
        {{ .Language.LanguageName }}
      </a>
    {{ end }}
  </nav>
{{ end }}
