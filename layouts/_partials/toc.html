{{ $toc := .TableOfContents }}
{{ if in $toc "<a href=\"#" }}
  <aside class="toc-card post-toc" aria-label="{{ T "toc.ariaLabel" }}">
    <div class="post-toc__inner">
      <div class="post-toc__title">{{ T "toc.title" }}</div>
      <button
        class="post-toc__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="post-toc-nav"
        data-label-open="{{ T "toc.expand" }}"
        data-label-close="{{ T "toc.collapse" }}"
      >
        <span>{{ T "toc.expand" }}</span>
        <span class="post-toc__toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="post-toc__nav" id="post-toc-nav">
        {{ $toc }}
      </nav>
    </div>
  </aside>
{{ end }}
