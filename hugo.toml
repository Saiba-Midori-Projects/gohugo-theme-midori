baseURL = 'https://example.org/'
defaultContentLanguage = 'zh-CN'
defaultContentLanguageInSubdir = false
contentDir = 'exampleSite/content'
# theme = 'midori'

[languages]
  [languages.zh-CN]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    title = 'Hugo Theme - Midori'
    weight = 1

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    title = 'Hugo Theme - Midori'
    weight = 2

[menus]
  [[menus.main]]
    identifier = 'menu.home'
    name = '首页'
    pageRef = '/'
    weight = 10

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[params]
    themeName = "Midori"
    version = "0.1.1"
    homeListPages = false
    # homeListSections = ["posts"]
  [params.author]
    name = 'KFACBT'
    email = 'gytxtx@outlook.com'

disableKinds = ["taxonomy", "term", "RSS"]

# ==========================================================
# Markdown 渲染设置
# ==========================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 设置为 true 以允许在 Markdown 文件中直接写 HTML 标签
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
