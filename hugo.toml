baseURL = 'https://example.org/'
defaultContentLanguage = 'zh-CN'
defaultContentLanguageInSubdir = false
contentDir = 'exampleSite/content'
# theme = 'midori'

[languages]
  [languages.zh-CN]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    title = 'Hugo Theme - Midori'
    weight = 1

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    title = 'Hugo Theme - Midori'
    weight = 2

[menus]
  [[menus.main]]
    identifier = 'menu.home'
    name = '首页'
    pageRef = '/'
    weight = 10

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[params]
    themeName = "Midori"
    version = "0.2.0"
    homeListPages = false
    # homeListSections = ["posts"]

  footerHTML = """
  <p>Copyright &copy; 2026 <a href="https://github.com/gytxtx">KFACBT</a>. All rights reserved.</p>
  <p style="margin-left: 0.5rem;"><a href="https://github.com/Saiba-Midori-Projects/gohugo-theme-midori">在 GitHub 上查看源代码</a></p>
  """

disableKinds = ["taxonomy", "term", "RSS"]

# ==========================================================
# Markdown 渲染设置
# ==========================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 设置为 true 以允许在 Markdown 文件中直接写 HTML 标签
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
