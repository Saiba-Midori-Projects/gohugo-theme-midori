baseURL = 'https://example.org/'
defaultContentLanguage = 'zh-CN'
defaultContentLanguageInSubdir = false
theme = 'gohugo-theme-midori'

[languages]
  [languages.zh-CN]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    title = 'Hugo Theme - Midori'
    weight = 1

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    title = 'Hugo Theme - Midori'
    weight = 2

[menus]
  [[menus.main]]
    identifier = 'menu.home'
    name = '首页'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    identifier = 'menu.testing'
    name = 'Testing'
    pageRef = '/testing'
    weight = 20

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[params]
  themeName = "Midori"
  version = "0.1.1"

  [params.author]
    name = 'KFACBT'
    email = 'gytxtx@outlook.com'

disableKinds = ["taxonomy", "term", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
